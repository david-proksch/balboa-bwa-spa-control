# nginx: the Pi's one web server on the home network, port 80.
#
# Installed to /etc/nginx/sites-available/james-brown by deploy/install.sh,
# but ONLY on a Pi where nginx was not installed before; an existing nginx
# setup is left as it is. Each application on the Pi adds its own file of
# locations to /etc/nginx/apps.d/ (the hot tub's is hot-tub.conf).
#
# There is no login and no HTTPS: this must not be reachable from the
# internet. If that ever changes, add both here first (PLAN.md, section 1).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/apps.d/*.conf;

    location = / {
        return 302 /hot-tub/;
    }
}
