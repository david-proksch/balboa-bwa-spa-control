# nginx: pass everything under /hot-tub/ to the hot tub controller.
#
# Installed to /etc/nginx/apps.d/hot-tub.conf by deploy/install.sh. It is
# a "location" and so only takes effect inside a "server" block that has
#     include /etc/nginx/apps.d/*.conf;
# On a Pi where nginx was not set up before, install.sh also installs such
# a server block (james-brown.conf in this directory).
#
# After editing on the Pi:  sudo nginx -t && sudo systemctl reload nginx

location = /hot-tub {
    return 308 /hot-tub/;
}

location /hot-tub/ {
    # No path after the port: the request is passed on with its /hot-tub
    # prefix, which is where the application serves everything.
    proxy_pass http://127.0.0.1:8100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The service answers in milliseconds, except that a command waits for
    # the spa to confirm, which can take some seconds while its Wi-Fi
    # module stalls (docs/balboa-notes.md).
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
